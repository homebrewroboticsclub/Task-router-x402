# Full stack: PostgreSQL + Node app. Background: restart: unless-stopped.
# Start: docker compose up -d --build
# Stop: docker compose down (Postgres data in named volume x402_raid_pgdata persists; remove volume: docker compose down -v)
# Logs: docker compose logs -f app
#
# DB connectivity: some hosts block container↔container TCP on the compose bridge (see DATA_NODE). If the app
# cannot use postgres:5432, use host networking for `app` and DATABASE_URL @127.0.0.1:<host port> (see below).
# Other settings from .env (Solana keys, TELEOPERATOR_JWT_SECRET, ADMIN_*, etc.).
# Persistent JSON under config/ is mounted into the container.

# Host volume name: <compose_project_name>_x402_raid_pgdata (default project name is the directory containing the compose file).
# Data safety: avoid docker compose down -v; avoid docker volume prune without checking; see README.
volumes:
  x402_raid_pgdata:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: x402
      POSTGRES_PASSWORD: x402
      POSTGRES_DB: x402raid
    volumes:
      - x402_raid_pgdata:/var/lib/postgresql/data
    # Host port 5436 avoids collisions. If this is 127.0.0.1-only, run `app` with network_mode: host and
    # DATABASE_URL @127.0.0.1:5436 (do not rely on host.docker.internal for this publish mode).
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U x402 -d x402raid"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  app:
    build:
      context: .
      # Use host DNS during image build (avoids EAI_AGAIN for registry.npmjs.org on some Docker setups).
      network: host
    restart: unless-stopped
    # Share host network so the app reaches Postgres on 127.0.0.1:5436 without container↔container bridge TCP
    # (and without recreating the Postgres container to change port publish). `ports:` is ignored in host mode.
    # The process binds HOST:PORT on the machine; if you see EADDRINUSE, pick a free port (set PORT in `.env`).
    network_mode: host
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "${PORT:-3000}"
      DATABASE_URL: postgres://x402:x402@127.0.0.1:5436/x402raid
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config:/app/config
