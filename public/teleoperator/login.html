<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teleoperator sign in</title>
    <link rel="stylesheet" href="/client/styles.css" />
    <link rel="stylesheet" href="/teleoperator/styles.css" />
  </head>
  <body>
    <header>
      <h1>Sign in</h1>
      <p>Login and password (wallet verification may be added later)</p>
    </header>
    <main>
      <section class="panel">
        <form id="login-form" class="auth-form">
          <label>
            Login
            <input name="login" type="text" required autocomplete="username" />
          </label>
          <label>
            Password
            <input name="password" type="password" required autocomplete="current-password" />
          </label>
          <p id="form-error" class="form-error hidden"></p>
          <button type="submit" class="btn-primary">Sign in</button>
        </form>
        <p class="auth-links">No account? <a href="/teleoperator/register.html">Register</a></p>
      </section>
    </main>
    <script src="/teleoperator/login.js"></script>
  </body>
</html>
