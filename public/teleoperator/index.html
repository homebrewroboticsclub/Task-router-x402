<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teleoperator Home — Homebrew Robotics · Task Router</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="min-h-screen flex flex-col">
    <!-- Top Navigation Bar -->
    <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
          <a href="/client" class="flex items-center gap-2 hover:opacity-90 transition-opacity no-underline">
            <img src="/brand/hbr-mark.png" alt="Homebrew Robotics" width="32" height="32" class="h-8 w-8 object-contain shrink-0" />
            <div class="flex flex-col leading-tight text-left">
              <span class="text-lg font-bold text-white tracking-tight">Homebrew Robotics</span>
              <span class="text-xs text-slate-400">Task Router — Teleoperator</span>
            </div>
          </a>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4">
      <div class="w-full max-w-md">
        <div class="text-center mb-8">
          <h1 class="text-3xl font-bold text-white mb-2">Teleoperator Portal</h1>
          <p class="text-slate-400">Join the network to assist robots remotely and earn SOL for resolving tasks.</p>
        </div>

        <section class="panel shadow-xl shadow-indigo-500/10 border-indigo-500/20">
          <h2 class="text-xl font-semibold mb-6 text-center">Get Started</h2>
          <div class="flex flex-col gap-4">
            <a href="/teleoperator/register.html" class="btn-primary w-full py-3 text-base shadow-lg shadow-indigo-500/20">Create Operator Account</a>
            <div class="relative flex items-center py-2">
              <div class="flex-grow border-t border-slate-700"></div>
              <span class="flex-shrink-0 mx-4 text-slate-500 text-sm">Already registered?</span>
              <div class="flex-grow border-t border-slate-700"></div>
            </div>
            <a href="/teleoperator/login.html" class="btn-secondary w-full py-3 text-base bg-slate-800/80">Sign In to Dashboard</a>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
